name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Verify Environment
        run: |
          xcodebuild -version
          cd ios
          xcodebuild -list -project RemoteControl.xcodeproj

      - name: Build iOS App (.app)
        run: |
          cd ios
          xcodebuild \
            -project RemoteControl.xcodeproj \
            -target RemoteControl \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package Unsigned IPA
        run: |
          cd ios
          mkdir -p Payload
          APP_PATH=$(find build -name "RemoteControl.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::RemoteControl.app was not found in build directory!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r RemoteControl.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteControl-iOS-IPA
          path: ios/RemoteControl.ipa
          retention-days: 30
